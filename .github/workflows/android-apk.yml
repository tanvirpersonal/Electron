name: Build Android APK

on:
  push:
    branches: [main, '1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Electron Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Electron launcher icons
        run: |
          python3 -m venv .venv-icon
          .venv-icon/bin/pip install --quiet cairosvg
          .venv-icon/bin/python scripts/generate-android-icon.py
      - name: Enable immersive fullscreen status bar hiding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main")
          candidates = list(root.glob("java/**/MainActivity.java")) + list(root.glob("kotlin/**/MainActivity.kt"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one MainActivity source, found: {candidates}")
          path = candidates[0]
          source = path.read_text()
          if "SYSTEM_UI_FLAG_FULLSCREEN" in source:
              raise SystemExit("Fullscreen configuration already exists; refusing duplicate patch")
          if path.suffix == ".java":
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\\nimport android.os.Bundle;\\nimport android.view.View;",
              )
              source = re.sub(
                  r"public class MainActivity extends BridgeActivity\\s*\\{\\s*\\}",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }
              }
          }""",
                  source,
              )
          else:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity",
                  "import com.getcapacitor.BridgeActivity\\nimport android.os.Bundle\\nimport android.view.View",
              )
              source += """

          """
              source = re.sub(
                  r"class MainActivity : BridgeActivity\\(\\)\\s*\\{?\\}?",
                  """class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  )
                  super.onCreate(savedInstanceState)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      )
                  }
              }
          }""",
                  source,
              )
          if "SYSTEM_UI_FLAG_FULLSCREEN" not in source or "onWindowFocusChanged" not in source:
              raise SystemExit("Failed to apply immersive fullscreen configuration")
          path.write_text(source)
          print(f"Immersive fullscreen enabled in {path}")
          PY
      - name: Lock app orientation to landscape
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find("application")
          if application is None:
              raise SystemExit("Android manifest has no application element")
          for activity in application.findall("activity"):
              name = activity.get(f"{{{android_ns}}}name", "")
              if name.endswith("MainActivity"):
                  activity.set(f"{{{android_ns}}}screenOrientation", "landscape")
                  break
          else:
              raise SystemExit("MainActivity not found in Android manifest")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Electron.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electron-Android-APK
          path: Electron.apk
          if-no-files-found: error
          retention-days: 30
