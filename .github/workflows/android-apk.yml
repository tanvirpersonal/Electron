name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Electron Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Electron launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 scripts/generate-android-icon.py
      - name: Lock app orientation to landscape
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find("application")
          if application is None:
              raise SystemExit("Android manifest has no application element")
          for activity in application.findall("activity"):
              name = activity.get(f"{{{android_ns}}}name", "")
              if name.endswith("MainActivity"):
                  activity.set(f"{{{android_ns}}}screenOrientation", "landscape")
                  break
          else:
              raise SystemExit("MainActivity not found in Android manifest")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Electron.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electron-Android-APK
          path: Electron.apk
          if-no-files-found: error
          retention-days: 30
